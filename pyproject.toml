[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meross-ble"
version = "0.2.1"
description = "Python library for Meross Bluetooth devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "ashionky" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = [
  "bleak>=0.22.0",
  "bleak-retry-connector>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/Meross-Tech/meross-ble"
Issues = "https://github.com/Meross-Tech/meross-ble/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
